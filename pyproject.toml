[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-reasoning-model"
version = "0.1.0"
description = "Decision Reasoning Model: fast, deterministic, calibrated decisions (binary, multiclass, ordinal or scalar) from a LoRA-tuned small LLM"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
